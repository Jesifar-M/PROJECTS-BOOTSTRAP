<!DOCTYPE html>
<html>
<head>
    <title>Travel Website</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

    <script>
    $(document).ready(function(){
      $('[data-toggle="tooltip"]').tooltip();
    });
    </script>
</head>

<body>

<!-- Carousel -->
<div id="travel" class="carousel slide" data-ride="carousel">

    <ul class="carousel-indicators">
        <li data-target="#travel" data-slide-to="0" class="active"></li>
        <li data-target="#travel" data-slide-to="1"></li>
        <li data-target="#travel" data-slide-to="2"></li>
    </ul>

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="https://t3.ftcdn.net/jpg/12/61/62/58/360_F_1261625896_moxQeeYntW01yx5WtChl5kNRrRnn6Hmg.jpg"
                 class="d-block w-100" height="500">

            <div class="carousel-caption">
                <h3>Alappuzha</h3>
                <p>Enjoy the beautiful backwaters of Kerala.</p>
            </div>
        </div>

        <div class="carousel-item">
            <img src="https://t3.ftcdn.net/jpg/00/59/46/64/360_F_59466409_IjrcA9OXD4qVCBSFHsm87Dxl53rUNKsV.jpg"
                 class="d-block w-100" height="500">

            <div class="carousel-caption">
                <h3>Kovalam</h3>
                <p>Relax at the famous Kovalam beach.</p>
            </div>
        </div>

        <div class="carousel-item">
            <img src="https://lp-cms-production.imgix.net/2022-03/shutterstockRF_606110843.jpg"
                 class="d-block w-100" height="500">

            <div class="carousel-caption">
                <h3>Trivandrum</h3>
                <p>Explore Kerala's capital city.</p>
            </div>
        </div>

    </div>

    <a class="carousel-control-prev" href="#travel" data-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </a>

    <a class="carousel-control-next" href="#travel" data-slide="next">
        <span class="carousel-control-next-icon"></span>
    </a>

</div>

<br>

<!-- Book Now Button -->
<div class="container text-center">
    <button type="button" class="btn btn-info"
            data-toggle="modal" data-target="#myModal">
        Book Now
    </button>
</div>

<!-- Modal -->
<div class="modal fade" id="myModal">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">

            <div class="modal-header">
                <h4 class="modal-title">Booking Details</h4>
                <button type="button" class="close" data-dismiss="modal">
                    &times;
                </button>
            </div>

            <div class="modal-body">
                <p>5 Days Kerala Tour Package</p>
                <p>Price: ₹15,000 per person</p>
                <p>Visit Alappuzha, Kovalam and Trivandrum.</p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-danger"
                        data-dismiss="modal">
                    Close
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Tooltip -->
<div class="text-center mt-3">
    <button class="btn btn-secondary"
            data-toggle="tooltip"
            title="Click Book Now to view booking details">
        ℹ
    </button>
</div>

</body>
</html>
